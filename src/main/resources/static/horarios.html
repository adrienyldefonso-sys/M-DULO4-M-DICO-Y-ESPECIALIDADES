<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Horarios y disponibilidad</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css?v=20261019-1">
</head>
<body>
<div id="top"></div>
<main>
    <div class="card">
        <div class="grid" style="margin:0"><div><label>Médico</label><select id="medico" onchange="cargar()"></select></div></div>
    </div>

    <div class="card solo-admin">
        <h2 id="hTit">Registrar horario de atención</h2>
        <form id="hF">
            <input type="hidden" id="hid">
            <div class="grid">
                <div><label>Día</label><select id="dia"></select></div>
                <div><label>Hora de inicio</label><input id="hi" type="time" required></div>
                <div><label>Hora de fin</label><input id="hf" type="time" required></div>
                <div><label>Duración de cada cita (min)</label><input id="dur" type="number" min="5" value="30" required></div>
            </div>
            <div class="acts"><button class="primary" id="hBtn">Registrar horario</button><button type="button" class="ghost hidden" id="hCan" onclick="limpiarH()">Cancelar edición</button></div>
        </form>
    </div>

    <div class="card"><h2>Horarios del médico</h2>
        <table><thead><tr><th>Día</th><th>Horario</th><th>Cita</th><th>Consultorio</th><th>Estado</th><th class="solo-admin">Acciones</th></tr></thead><tbody id="hBody"></tbody></table>
    </div>

    <div class="card solo-admin">
        <h2>Bloquear un horario puntual</h2>
        <form id="bF">
            <div class="grid">
                <div><label>Fecha</label><input id="bf" type="date" required></div>
                <div><label>Desde</label><input id="bi" type="time" required></div>
                <div><label>Hasta</label><input id="bh" type="time" required></div>
                <div><label>Motivo</label><input id="bm" required></div>
            </div>
            <div class="acts"><button class="primary">Bloquear horario</button></div>
        </form>
    </div>
    <div class="card"><h2>Bloqueos del médico</h2>
        <table><thead><tr><th>Fecha</th><th>Horas</th><th>Motivo</th><th>Estado</th></tr></thead><tbody id="bBody"></tbody></table>
    </div>

    <div class="card"><h2>Disponibilidad del médico</h2>
        <div class="grid"><div><label>Fecha a consultar</label><input id="df" type="date"></div></div>
        <div class="acts" style="margin-bottom:12px"><button class="primary" onclick="disp()">Ver disponibilidad</button></div>
        <div id="slots" class="mut">Elige una fecha y consulta.</div>
    </div>
</main>
<div id="toast"></div>

<script src="app.js"></script>
<script>
    const { $, esc, badge, toast, api, admin } = App;
    App.layout('Horarios y disponibilidad', true);
    if (!admin) document.querySelectorAll('.solo-admin').forEach(e => e.remove());
    const DIAS = ['LUNES', 'MARTES', 'MIERCOLES', 'JUEVES', 'VIERNES', 'SABADO', 'DOMINGO'];
    const hms = v => v.length === 5 ? v + ':00' : v, hm = v => String(v).slice(0, 5);
    let hor = [], cons = [];
    const mid = () => $('#medico').value;
    if (admin) $('#dia').innerHTML = DIAS.map(d => `<option>${d}</option>`).join('');

    async function init() {
      try {
        const med = (await api('/medicos')).filter(m => m.estado);
        cons = (await api('/consultorios')).filter(c => c.estado !== 'INACTIVO');
        $('#medico').innerHTML = med.map(m => `<option value="${m.id}">${esc(m.nombre)} ${esc(m.apellido)}</option>`).join('');
        cargar();
      } catch (e) { toast(e.message, true); }
    }

    async function cargar() {
      if (!mid()) return;
      try {
        const [h, b] = await Promise.all([api('/horarios/medico/' + mid()), api('/horarios/medico/' + mid() + '/bloqueos')]);
        hor = h;
        $('#hBody').innerHTML = h.map(x => {
          const opc = cons.map(c => `<option value="${c.id}" ${x.consultorio && x.consultorio.id === c.id ? 'selected' : ''}>${esc(c.codigo)}</option>`).join('');
          return `<tr><td><b>${esc(x.diaSemana)}</b></td><td>${hm(x.horaInicio)} – ${hm(x.horaFin)}</td><td>${x.duracionCitaMinutos} min</td>
            <td>${x.consultorio ? esc(x.consultorio.codigo) : '<span class="mut">Sin asignar</span>'}
              ${admin ? `<br><select id="c${x.id}" style="width:auto;margin-top:4px">${opc}</select> <button onclick="asignar(${x.id})">Asignar</button>` : ''}</td>
            <td>${badge(x.estado)}</td>${admin ? `<td><button onclick="editH(${x.id})">Editar</button></td>` : ''}</tr>`;
        }).join('') || '<tr><td colspan="6">El médico no tiene horarios</td></tr>';
        $('#bBody').innerHTML = b.map(x => `<tr><td>${esc(x.fecha)}</td><td>${hm(x.horaInicio)} – ${hm(x.horaFin)}</td><td>${esc(x.motivo)}</td><td>${esc(x.estado)}</td></tr>`).join('')
          || '<tr><td colspan="4">Sin bloqueos</td></tr>';
      } catch (e) { toast(e.message, true); }
    }

    function editH(id) {
      const h = hor.find(x => x.id === id);
      $('#hid').value = id; $('#dia').value = h.diaSemana; $('#hi').value = hm(h.horaInicio); $('#hf').value = hm(h.horaFin); $('#dur').value = h.duracionCitaMinutos;
      $('#hTit').textContent = 'Modificar horario'; $('#hBtn').textContent = 'Guardar cambios'; $('#hCan').classList.remove('hidden'); scrollTo(0, 0);
    }
    function limpiarH() { $('#hF').reset(); $('#hid').value = ''; $('#hTit').textContent = 'Registrar horario de atención'; $('#hBtn').textContent = 'Registrar horario'; $('#hCan').classList.add('hidden'); }

    if (admin) {
      $('#hF').onsubmit = async e => {
        e.preventDefault(); const id = $('#hid').value;
        const body = { diaSemana: $('#dia').value, horaInicio: hms($('#hi').value), horaFin: hms($('#hf').value), duracionCitaMinutos: +$('#dur').value };
        try {
          await api(id ? '/horarios/' + id : '/horarios/medico/' + mid(), { method: id ? 'PUT' : 'POST', body: JSON.stringify(body) });
          toast(id ? 'Horario actualizado' : 'Horario registrado'); limpiarH(); cargar();
        } catch (x) { toast(x.message, true); }
      };
      $('#bF').onsubmit = async e => {
        e.preventDefault();
        const body = { fecha: $('#bf').value, horaInicio: hms($('#bi').value), horaFin: hms($('#bh').value), motivo: $('#bm').value.trim() };
        try { await api('/horarios/medico/' + mid() + '/bloqueos', { method: 'POST', body: JSON.stringify(body) }); toast('Horario bloqueado'); $('#bF').reset(); cargar(); } catch (x) { toast(x.message, true); }
      };
    }

    // RF-MED-16 / RF-MED-17: si el consultorio ya está ocupado por otro médico en ese horario, el backend responde 409
    async function asignar(hid) {
      try { await api(`/consultorios/horario/${hid}/asignar/${$('#c' + hid).value}`, { method: 'PATCH' }); toast('Consultorio asignado'); cargar(); } catch (x) { toast(x.message, true); }
    }

    async function disp() {
      if (!$('#df').value) return toast('Elige una fecha', true);
      try {
        const s = await api(`/disponibilidad/medico/${mid()}?fecha=${$('#df').value}`);
        $('#slots').innerHTML = s.map(x => x.horaInicio
          ? `<span class="slot ${x.disponible ? 'ok' : 'no'}" title="${esc(x.motivo || '')}">${hm(x.horaInicio)} – ${hm(x.horaFin)}</span>`
          : `<span class="slot no">${esc(x.motivo)}</span>`).join('') || 'El médico no atiende ese día.';
      } catch (x) { toast(x.message, true); }
    }
    init();
</script>
</body>
</html>
