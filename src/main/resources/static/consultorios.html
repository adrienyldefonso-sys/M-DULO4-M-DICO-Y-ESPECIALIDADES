<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Consultorios</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css?v=20261019-1">
</head>
<body>
<div id="top"></div>
<main>
    <div class="card solo-admin">
        <h2>Registrar consultorio</h2>
        <form id="f">
            <div class="grid">
                <div><label>Código (único, ej. C-205)</label><input id="cod" required></div>
                <div><label>Nombre</label><input id="nom" required></div>
                <div><label>Piso</label><input id="piso"></div>
                <div><label>Área</label><input id="area"></div>
            </div>
            <div class="acts"><button class="primary">Registrar consultorio</button></div>
        </form>
    </div>
    <div class="card"><h2>Consultorios</h2>
        <p class="mut" style="margin-top:0">El consultorio se asigna a un médico desde <b>Horarios y disponibilidad</b>.</p>
        <table><thead><tr><th>Código</th><th>Nombre</th><th>Piso</th><th>Área</th><th>Estado</th></tr></thead><tbody id="body"></tbody></table>
    </div>
</main>
<div id="toast"></div>

<script src="app.js"></script>
<script>
    const { $, esc, toast, api, admin } = App;
    App.layout('Consultorios', true);
    if (!admin) document.querySelectorAll('.solo-admin').forEach(e => e.remove());

    async function cargar() {
      try {
        const c = await api('/consultorios');
        $('#body').innerHTML = c.map(x => `<tr><td><b>${esc(x.codigo)}</b></td><td>${esc(x.nombre)}</td><td>${esc(x.piso || '—')}</td><td>${esc(x.area || '—')}</td><td>${esc(x.estado)}</td></tr>`).join('')
          || '<tr><td colspan="5">Aún no hay consultorios</td></tr>';
      } catch (e) { toast(e.message, true); }
    }
    if (admin) $('#f').onsubmit = async e => {
      e.preventDefault();
      const body = { codigo: $('#cod').value.trim(), nombre: $('#nom').value.trim(), piso: $('#piso').value.trim(), area: $('#area').value.trim() };
      try { await api('/consultorios', { method: 'POST', body: JSON.stringify(body) }); toast('Consultorio registrado'); $('#f').reset(); cargar(); } catch (x) { toast(x.message, true); }
    };
    cargar();
</script>
</body>
</html>
